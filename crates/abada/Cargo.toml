[package]
name = "abada"
description = "Runtime for REST/JSON gateways generated from google.api.http annotations over tonic gRPC services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
http.workspace = true
# Request population (abada::request): descriptors, dynamic messages and, for
# now, the interim body decoder on prost-reflect's serde support.
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json.workspace = true

[dev-dependencies]
serde.workspace = true
base64 = "0.22"
prost.workspace = true
